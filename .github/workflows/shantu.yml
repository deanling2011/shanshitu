name: Shantu Daily Check


on:

  workflow_dispatch:

  schedule:

    # 北京时间每天09:00
    # UTC+8

    - cron: "0 1 * * *"



permissions:

  contents: read

  pages: write

  id-token: write





jobs:


  build:


    runs-on: ubuntu-latest


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:



      # =====================
      # 拉取代码
      # =====================

      - name: Checkout

        uses: actions/checkout@v4





      # =====================
      # Python环境
      # =====================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"





      # =====================
      # 缓存
      # =====================

      - name: Cache Python packages

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key:

            python-${{ runner.os }}-${{ hashFiles('shantu/requirements.txt') }}

          restore-keys:

            python-${{ runner.os }}-





      # =====================
      # 安装依赖
      # =====================

      - name: Install requirements

        run: |

          pip install -r shantu/requirements.txt





      # =====================
      # PDF解析
      # =====================

      - name: Run PDF parser

        run: |

          echo "===================="

          echo "开始解析山图集PDF"

          echo "===================="


          python shantu/scripts/build_index.py


          echo "PDF解析完成"





      # =====================
      # 检查结果
      # =====================

      - name: Check result

        id: check

        run: |


          if [ -f "shantu/result/status.txt" ]; then


            echo "found=true" >> $GITHUB_OUTPUT


            echo "检测到新山图"


          else


            echo "found=false" >> $GITHUB_OUTPUT


            echo "今天没有更新"


          fi





      # =====================
      # 查看生成内容
      # =====================

      - name: Check generated files

        if: steps.check.outputs.found == 'true'

        run: |


          echo "===== 文件列表 ====="


          find shantu/result -maxdepth 2 -type f



          echo ""

          echo "===== 通知内容 ====="


          cat shantu/result/notify.txt





      # =====================
      # Pages准备
      # =====================

      - name: Prepare Pages

        if: steps.check.outputs.found == 'true'

        run: |


          mkdir -p public


          cp -r shantu/result/* public/


          echo "Pages准备完成"





      # =====================
      # 上传Pages
      # =====================

      - name: Upload Pages artifact

        if: steps.check.outputs.found == 'true'

        uses: actions/upload-pages-artifact@v3

        with:

          path: public





      # =====================
      # 发布Pages
      # =====================

      - name: Deploy to GitHub Pages

        if: steps.check.outputs.found == 'true'

        id: deployment

        uses: actions/deploy-pages@v4





      # =====================
      # PushDeer成功通知
      # =====================

      - name: PushDeer Notify

        if: steps.check.outputs.found == 'true'

        run: |


          echo "开始发送PushDeer"



          MESSAGE=$(cat shantu/result/notify.txt)



          COVER=$(cat shantu/result/cover.txt)





          RESPONSE=$(curl -s \

          "https://api2.pushdeer.com/message/push" \

          -G \

          --data-urlencode "pushkey=${{ secrets.PUSHDEER_KEY }}" \

          --data-urlencode "text=🌄 山图集每日更新" \

          --data-urlencode "desp=${MESSAGE}" \

          --data-urlencode "type=markdown" \

          --data-urlencode "image=${COVER}")





          echo "PushDeer返回:"

          echo "$RESPONSE"





          if echo "$RESPONSE" | grep -q '"code":0';

          then

            echo "PushDeer发送成功"

          else

            echo "PushDeer发送失败"

            exit 1

          fi







      # =====================
      # 失败通知
      # =====================

      - name: PushDeer Failed Notify

        if: failure()

        run: |


          curl -s \

          "https://api2.pushdeer.com/message/push" \

          -G \

          --data-urlencode "pushkey=${{ secrets.PUSHDEER_KEY }}" \

          --data-urlencode "text=❌ 山图集运行失败" \

          --data-urlencode "desp=


GitHub Actions执行失败


仓库：

https://github.com/${{ github.repository }}/actions


请检查日志。


"


