name: Shantu Daily Check


on:

  workflow_dispatch:

  schedule:
    # 北京时间每天09:00
    # UTC+8
    - cron: "0 1 * * *"



permissions:

  contents: read
  pages: write
  id-token: write



jobs:


  build:


    runs-on: ubuntu-latest


    # GitHub Pages标准环境
    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:


      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4



      # Python环境
      - name: Setup Python
        uses: actions/setup-python@v5

        with:

          python-version: "3.11"



      # Python缓存
      - name: Cache Python packages
        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: python-${{ runner.os }}



      # 安装依赖
      - name: Install requirements
        run: |

          pip install -r shantu/requirements.txt



      # 执行PDF解析
      - name: Run PDF parser
        run: |

          python shantu/scripts/build_index.py



      # 判断是否生成新内容
      - name: Check result

        id: check

        run: |

          if [ -f "shantu/result/status.txt" ]; then

            echo "found=true" >> $GITHUB_OUTPUT

          else

            echo "found=false" >> $GITHUB_OUTPUT

          fi



      # 准备网页
      - name: Prepare Pages

        if: steps.check.outputs.found == 'true'

        run: |


          mkdir -p public


          cp -r shantu/result/* public/



      # 上传网页
      - name: Upload Pages artifact

        if: steps.check.outputs.found == 'true'

        uses: actions/upload-pages-artifact@v3

        with:

          path: public



      # 发布网页
      - name: Deploy to GitHub Pages

        if: steps.check.outputs.found == 'true'

        id: deployment

        uses: actions/deploy-pages@v4



      # PushDeer通知
      - name: PushDeer Notify

        if: steps.check.outputs.found == 'true'

        run: |


          curl "https://api2.pushdeer.com/message/push" \
          -G \
          --data-urlencode "pushkey=${{ secrets.PUSHDEER_KEY }}" \
          --data-urlencode "text=山图集更新提醒" \
          --data-urlencode "desp=今天的山图集已经生成：https://deanling2011.github.io/shanshitu/"
