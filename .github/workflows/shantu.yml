name: Shantu Daily Check


on:

  workflow_dispatch:

  schedule:

    # 北京时间每天00:20
    # UTC时间16:20

    - cron: "20 16 * * *"




permissions:

  contents: read

  pages: write

  id-token: write




jobs:


  build:


    runs-on: ubuntu-latest


    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}



    steps:


      # =====================
      # Checkout
      # =====================

      - name: Checkout

        uses: actions/checkout@v4




      # =====================
      # Python
      # =====================

      - name: Setup Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"




      # =====================
      # Cache
      # =====================

      - name: Cache Python packages

        uses: actions/cache@v4

        with:

          path: ~/.cache/pip

          key: python-${{ runner.os }}-${{ hashFiles('shantu/requirements.txt') }}

          restore-keys: |

            python-${{ runner.os }}-




      # =====================
      # Install
      # =====================

      - name: Install requirements

        run: |

          pip install -r shantu/requirements.txt





      # =====================
      # Run
      # =====================

      - name: Run PDF parser

        run: |

          echo "开始解析山图集PDF"

          python shantu/scripts/build_index.py

          echo "解析完成"





      # =====================
      # Check
      # =====================

      - name: Check result

        id: check

        run: |


          if [ -f "shantu/result/status.txt" ]; then

            echo "found=true" >> $GITHUB_OUTPUT

          else

            echo "found=false" >> $GITHUB_OUTPUT

          fi






      # =====================
      # Debug
      # =====================

      - name: Check generated files

        if: steps.check.outputs.found == 'true'

        run: |


          echo "===== result ====="

          find shantu/result -type f


          echo "===== notify ====="

          cat shantu/result/notify.txt






      # =====================
      # Pages
      # =====================

      - name: Prepare Pages

        if: steps.check.outputs.found == 'true'

        run: |


          mkdir public


          cp -r shantu/result/* public/





      - name: Upload Pages artifact

        if: steps.check.outputs.found == 'true'

        uses: actions/upload-pages-artifact@v3

        with:

          path: public






      - name: Deploy to GitHub Pages

        if: steps.check.outputs.found == 'true'

        id: deployment

        uses: actions/deploy-pages@v4







      # =====================
      # PushDeer Success
      # =====================

      - name: PushDeer Notify

        if: steps.check.outputs.found == 'true'

        run: |


          echo "发送PushDeer通知"


          MESSAGE=$(cat shantu/result/notify.txt)


          curl -s "https://api2.pushdeer.com/message/push" \
          -G \
          --data-urlencode "pushkey=${{ secrets.PUSHDEER_KEY }}" \
          --data-urlencode "text=🌄 山图集每日更新" \
          --data-urlencode "desp=${MESSAGE}" \
          --data-urlencode "type=markdown"






      # =====================
      # PushDeer Failed
      # =====================

      - name: PushDeer Failed Notify

        if: failure()

        run: |


          echo "发送失败通知"


          curl -s "https://api2.pushdeer.com/message/push" \
          -G \
          --data-urlencode "pushkey=${{ secrets.PUSHDEER_KEY }}" \
          --data-urlencode "text=❌ 山图集运行失败" \
          --data-urlencode "desp=GitHub Actions执行失败，请检查日志 https://github.com/${{ github.repository }}/actions"
