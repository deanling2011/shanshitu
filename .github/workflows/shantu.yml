name: Shantu Daily Check


on:

  workflow_dispatch:

  schedule:
    # 北京时间每天09:00
    # UTC+8
    - cron: "0 1 * * *"



permissions:
  contents: read
  pages: write
  id-token: write



jobs:


  build:


    runs-on: ubuntu-latest


    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}


    steps:


      # 拉取代码
      - name: Checkout
        uses: actions/checkout@v4



      # Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"



      # 安装依赖
      - name: Install requirements
        run: |
          pip install -r shantu/requirements.txt



      # 解析PDF
      - name: Run PDF parser
        run: |
          python shantu/scripts/build_index.py



      # 准备Pages目录
      - name: Prepare Pages
        run: |

          mkdir -p public

          cp -r shantu/result/* public/ || true



      # 上传Pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public



      # 发布Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4



      # PushDeer
      - name: PushDeer Notify
        if: hashFiles('shantu/result/*') != ''
        run: |

          curl "https://api2.pushdeer.com/message/push" \
          -G \
          --data-urlencode "pushkey=${{ secrets.PUSHDEER_KEY }}" \
          --data-urlencode "text=山图集更新提醒" \
          --data-urlencode "desp=今天的山图集已经生成： https://deanling2011.github.io/shanshitu/"
